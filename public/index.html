<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DANASIRI ENGINE</title>
    <style>
        body { margin:0; background:#000; color:#00ffa3; font-family:monospace; overflow:hidden; }
        #ui { position:fixed; top:20px; left:20px; z-index:100; background:rgba(0,0,0,0.8); padding:15px; border-left:4px solid #00ffa3; }
        video { width:100vw; height:100vh; object-fit:cover; }
        .btn { background:#111; color:#00ffa3; border:1px solid #00ffa3; padding:10px; cursor:pointer; margin-top:10px; width:100%; font-family:monospace; }
        .btn-danger { color: #ff4444; border-color: #ff4444; }
    </style>
</head>
<body>
    <div id="ui">
        <strong style="font-size:1.2em;">DANASIRI ENGINE</strong><br>
        <span id="status">STATUS: IDLE</span>
        <div id="push-ui" style="display:none;">
            <select id="bitrate" class="btn">
                <option value="6000">1080p | 6 Mbps</option>
                <option value="12000">1080p | 12 Mbps</option>
            </select>
            <button id="disconnectBtn" class="btn btn-danger">DISCONNECT</button>
        </div>
    </div>
    <video id="v" autoplay playsinline muted></video>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io({ transports: ['websocket'] });
        const params = new URLSearchParams(window.location.search);
        const role = params.get('role');
        const roomId = window.location.pathname.split('/')[1] || 'lobby';
        const videoEl = document.getElementById('v');
        const status = document.getElementById('status');

        let pc;
        let localStream;

        async function init() {
            pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });

            pc.onicecandidate = (e) => {
                if (e.candidate) socket.emit('signal', { roomId, content: { candidate: e.candidate } });
            };

            pc.onconnectionstatechange = () => {
                status.innerText = `ICE: ${pc.connectionState.toUpperCase()}`;
                if(pc.connectionState === 'connected' && role === 'push') applyBitrate();
            };

            if (role === 'push') {
                document.getElementById('push-ui').style.display = 'block';
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 1920, height: 1080, aspectRatio: 1.777, facingMode: "environment" },
                    audio: true
                });
                videoEl.srcObject = localStream;
                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
            } else {
                pc.ontrack = (e) => { videoEl.srcObject = e.streams[0]; };
            }
            socket.emit('join-room', roomId);
        }

        socket.on('peer-ready', () => {
            if (role === 'view') socket.emit('signal', { roomId, content: { type: 'start' } });
        });

        socket.on('signal', async (data) => {
            if (data.type === 'start' && role === 'push') {
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                socket.emit('signal', { roomId, content: { sdp: offer } });
            } else if (data.sdp) {
                await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
                if (data.sdp.type === 'offer') {
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    socket.emit('signal', { roomId, content: { sdp: answer } });
                }
            } else if (data.candidate) {
                pc.addIceCandidate(new RTCIceCandidate(data.candidate)).catch(() => {});
            }
        });

        async function applyBitrate() {
            const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
            if (sender) {
                const p = sender.getParameters();
                p.encodings[0].maxBitrate = document.getElementById('bitrate').value * 1000;
                await sender.setParameters(p);
            }
        }

        document.getElementById('disconnectBtn').onclick = () => {
            if(localStream) localStream.getTracks().forEach(t => t.stop());
            pc.close();
            location.reload();
        };

        init();
    </script>
</body>
</html>
