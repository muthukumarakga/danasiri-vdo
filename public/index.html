<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io({ transports: ['websocket'] });
    const params = new URLSearchParams(window.location.search);
    const role = params.get('role') || 'push';
    const roomId = window.location.pathname.split('/')[1] || 'lobby';
    
    let pc, localStream, videoTrack;
    const videoEl = document.getElementById('v');

    const rtcConfig = {
        iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
    };

    async function init() {
        // 1. Setup Peer Connection
        pc = new RTCPeerConnection(rtcConfig);
        
        // 2. Handle ICE Candidates (Connection paths)
        pc.onicecandidate = (e) => {
            if (e.candidate) {
                socket.emit('signal', { roomId, content: { candidate: e.candidate } });
            }
        };
        
        // 3. Status indicator
        pc.onconnectionstatechange = () => {
            const dot = document.getElementById('status-dot');
            if(dot) dot.style.background = pc.connectionState === 'connected' ? '#00ffa3' : '#ff4444';
            if(pc.connectionState === 'connected') startStats();
        };

        // 4. Handle incoming video for VIEWERS
        pc.ontrack = (e) => {
            console.log("Stream received!");
            videoEl.srcObject = e.streams[0];
        };

        // 5. Setup based on ROLE
        if (role === 'push') {
            await enumerateCameras();
            await startCamera();
        } else {
            document.getElementById('push-ui').style.display = 'none';
            videoEl.muted = false; // Viewers need sound
            // Viewer creates the initial "RE" request
            console.log("Viewer joining, requesting stream...");
        }
        
        socket.emit('join-room', roomId);
    }

    // --- Signaling Logic (The Handshake) ---
    socket.on('peer-ready', async () => {
        // If someone joins and we are the PUSH, send them an offer
        if (role === 'push' && localStream) {
            console.log("New viewer detected, creating offer...");
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            socket.emit('signal', { roomId, content: { sdp: offer } });
        }
    });

    socket.on('signal', async (d) => {
        if (d.sdp) {
            await pc.setRemoteDescription(new RTCSessionDescription(d.sdp));
            if (d.sdp.type === 'offer') {
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                socket.emit('signal', { roomId, content: { sdp: answer } });
            }
        } else if (d.candidate) {
            try {
                await pc.addIceCandidate(new RTCIceCandidate(d.candidate));
            } catch(e) { console.error("ICE Error", e); }
        }
    });

    // --- Camera Functions ---
    async function enumerateCameras() {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const vids = devices.filter(d => d.kind === 'videoinput');
        const sel = document.getElementById('cameraSelect');
        sel.innerHTML = '';
        vids.forEach((d, i) => {
            const opt = document.createElement('option');
            opt.value = d.deviceId;
            opt.text = d.label || `Camera ${i}`;
            sel.appendChild(opt);
        });
    }

    async function startCamera() {
        if (localStream) localStream.getTracks().forEach(t => t.stop());
        
        const constraints = {
            audio: true,
            video: {
                deviceId: { exact: document.getElementById('cameraSelect').value },
                aspectRatio: { ideal: parseFloat(document.getElementById('aspectSelect').value) },
                width: { ideal: 1920 }
            }
        };

        try {
            localStream = await navigator.mediaDevices.getUserMedia(constraints);
            videoEl.srcObject = localStream;
            videoTrack = localStream.getVideoTracks()[0];
            
            // Add track to existing connection
            localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
            
            // Hardware controls
            const caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
            if (caps.zoom) {
                const z = document.getElementById('zoom');
                z.min = caps.zoom.min; z.max = caps.zoom.max; z.step = caps.zoom.step;
            }
            document.getElementById('toggleTorch').style.display = caps.torch ? 'block' : 'none';
            applyBitrate();
        } catch (e) { console.error("Camera Error", e); }
    }

    // --- Stats & Helpers ---
    async function applyBitrate() {
        const sender = pc.getSenders().find(s => s.track?.kind === 'video');
        if (!sender) return;
        const p = sender.getParameters();
        const bit = document.getElementById('bitrate').value;
        document.getElementById('bVal').innerText = bit;
        p.encodings = [{ maxBitrate: bit * 1000 }];
        await sender.setParameters(p);
    }

    function startStats() {
        setInterval(async () => {
            const stats = await pc.getStats();
            stats.forEach(r => {
                if (r.type === 'outbound-rtp' && r.kind === 'video') {
                    document.getElementById('s-res').innerText = r.frameWidth + "x" + r.frameHeight;
                    document.getElementById('s-fps').innerText = Math.round(r.framesPerSecond || 0) + " FPS";
                    document.getElementById('s-bit').innerText = Math.round(r.bytesSent / 1024) + " kbps";
                }
            });
        }, 1000);
    }

    document.getElementById('cameraSelect').onchange = startCamera;
    document.getElementById('aspectSelect').onchange = startCamera;
    document.getElementById('bitrate').onchange = applyBitrate;
    document.getElementById('showAdv').onclick = () => {
        const d = document.getElementById('adv-drawer');
        d.style.display = d.style.display === 'block' ? 'none' : 'block';
    };
    document.getElementById('zoom').oninput = (e) => {
        document.getElementById('zVal').innerText = e.target.value + "x";
        videoTrack.applyConstraints({ advanced: [{ zoom: e.target.value }] });
    };

    init();
</script>
