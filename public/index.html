<!DOCTYPE html>
<html>
<head>
    <title>Danasiri | P2P</title>
    <style>
        body { margin:0; background:#000; color:#0bdf7e; font-family:sans-serif; overflow:hidden; }
        #ui { position:fixed; top:20px; left:20px; z-index:10; background:rgba(0,0,0,0.7); padding:15px; border-left:3px solid #0bdf7e; }
        video { width:100vw; height:100vh; object-fit:cover; }
        .btn { background:#0bdf7e; border:none; padding:8px 15px; cursor:pointer; font-weight:bold; }
    </style>
</head>
<body>
    <div id="ui">
        <strong>DANASIRI</strong> | <span id="roomName"></span><br>
        <small id="status">Initializing...</small><br><br>
        <button id="muteBtn" class="btn" style="display:none;">MUTE REMOTE</button>
    </div>
    <video id="v" autoplay playsinline></video>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const urlParams = new URLSearchParams(window.location.search);
        const role = urlParams.get('role'); // 'push' or 'view'
        const roomId = window.location.pathname.split('/')[1] || 'lobby';
        
        document.getElementById('roomName').innerText = roomId.toUpperCase();
        const status = document.getElementById('status');
        const videoElement = document.getElementById('v');
        
        let pc;
        let dataChannel;
        const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        async function init() {
            pc = new RTCPeerConnection(config);

            // 1. ICE Candidate handling
            pc.onicecandidate = (e) => {
                if (e.candidate) socket.emit('signal', { roomId, content: { candidate: e.candidate } });
            };

            if (role === 'push') {
                // PHONE SIDE logic
                status.innerText = "Role: CAMERA (Pushing)";
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 1280, height: 720, frameRate: 30 }, audio: true 
                });
                videoElement.srcObject = stream;
                videoElement.muted = true;
                stream.getTracks().forEach(track => pc.addTrack(track, stream));
                
                // Listen for remote control
                pc.ondatachannel = (e) => {
                    e.channel.onmessage = (msg) => {
                        const data = JSON.parse(msg.data);
                        if(data.type === 'MUTE') stream.getAudioTracks()[0].enabled = !data.value;
                    };
                };
            } else {
                // OBS SIDE logic
                status.innerText = "Role: OBS (Viewing)";
                document.getElementById('muteBtn').style.display = 'block';
                dataChannel = pc.createDataChannel("control");
                
                pc.ontrack = (e) => { videoElement.srcObject = e.streams[0]; };
                
                document.getElementById('muteBtn').onclick = () => {
                    dataChannel.send(JSON.stringify({type: 'MUTE', value: true}));
                    status.innerText = "Sent Mute Command";
                };
            }

            socket.emit('join-room', roomId);
        }

        // Signaling Handlers
        socket.on('user-joined', async () => {
            if (role === 'push') {
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                socket.emit('signal', { roomId, content: { sdp: offer } });
            }
        });

        socket.on('signal', async ({ content }) => {
            if (content.sdp) {
                await pc.setRemoteDescription(new RTCSessionDescription(content.sdp));
                if (content.sdp.type === 'offer') {
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    socket.emit('signal', { roomId, content: { sdp: answer } });
                }
            } else if (content.candidate) {
                await pc.addIceCandidate(new RTCIceCandidate(content.candidate));
            }
        });

        init();
    </script>
</body>
</html>
