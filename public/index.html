<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DANASIRI | OBS MASTER</title>
    <style>
        body { margin:0; background:#000; color:#00ffa3; font-family:monospace; overflow:hidden; }
        #ui { position:fixed; top:20px; left:20px; z-index:100; background:rgba(0,0,0,0.8); padding:15px; border-left:4px solid #00ffa3; }
        video { width:100vw; height:100vh; object-fit:cover; }
        .btn { background:#111; color:#00ffa3; border:1px solid #00ffa3; padding:10px; cursor:pointer; margin-top:8px; width:100%; font-family:monospace; }
        .btn-danger { color: #ff4444; border-color: #ff4444; }
    </style>
</head>
<body>
    <div id="ui">
        <strong style="font-size:18px;">DANASIRI ENGINE</strong><br>
        <span id="status">STATUS: IDLE</span><br>
        
        <div id="push-controls" style="display:none;">
            <select id="bitrate" class="btn">
                <option value="6000">1080p | 6Mbps</option>
                <option value="10000">1080p | 10Mbps</option>
            </select>
            <button id="disconnectBtn" class="btn btn-danger">DISCONNECT</button>
        </div>
    </div>
    <video id="v" autoplay playsinline muted></video>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io({ transports: ['websocket'] });
        const params = new URLSearchParams(window.location.search);
        const role = params.get('role');
        const roomId = window.location.pathname.split('/')[1] || 'lobby';
        const videoEl = document.getElementById('v');
        const status = document.getElementById('status');

        let pc;
        let localStream;

        async function start() {
            pc = new RTCPeerConnection({
                iceServers: [{ urls: 'stun:stun.l.google.com:19302' }],
                iceCandidatePoolSize: 10
            });

            pc.onicecandidate = (e) => {
                if (e.candidate) socket.emit('signal', { roomId, content: { candidate: e.candidate } });
            };

            pc.onconnectionstatechange = () => {
                status.innerText = `ICE: ${pc.connectionState.toUpperCase()}`;
                if(pc.connectionState === 'connected' && role === 'push') applyBitrate();
            };

            if (role === 'push') {
                document.getElementById('push-controls').style.display = 'block';
                
                // BACK CAMERA & OBS RESOLUTION CONFIG
                const constraints = {
                    video: {
                        width: { ideal: 1920 },
                        height: { ideal: 1080 },
                        aspectRatio: 1.777777778, // Force 16:9 for OBS
                        facingMode: { ideal: "environment" }, // BACK CAMERA
                        frameRate: { ideal: 60 }
                    },
                    audio: true
                };

                try {
                    localStream = await navigator.mediaDevices.getUserMedia(constraints);
                    videoEl.srcObject = localStream;
                    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
                } catch (e) {
                    alert("Camera Error: " + e.message);
                }

                document.getElementById('disconnectBtn').onclick = disconnect;
            } else {
                pc.ontrack = (e) => { videoEl.srcObject = e.streams[0]; };
            }

            socket.emit('join-room', roomId);
        }

        // DISCONNECT LOGIC
        function disconnect() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
            if (pc) {
                pc.close();
            }
            socket.disconnect();
            status.innerText = "STATUS: DISCONNECTED";
            videoEl.srcObject = null;
            setTimeout(() => location.reload(), 2000); // Reload to reset state
        }

        // SIGNALING
        socket.on('peer-joined', async () => {
            if (role === 'push') {
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                socket.emit('signal', { roomId, content: { sdp: offer } });
            }
        });

        socket.on('signal', async (data) => {
            if (data.sdp) {
                await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
                if (data.sdp.type === 'offer') {
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    socket.emit('signal', { roomId, content: { sdp: answer } });
                }
            } else if (data.candidate) {
                pc.addIceCandidate(new RTCIceCandidate(data.candidate)).catch(e => console.error(e));
            }
        });

        async function applyBitrate() {
            const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
            if (sender) {
                const p = sender.getParameters();
                p.encodings[0].maxBitrate = document.getElementById('bitrate').value * 1000;
                await sender.setParameters(p);
            }
        }

        document.getElementById('bitrate').onchange = applyBitrate;
        start();
    </script>
</body>
</html>
