<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DANASIRI | MASTER</title>
    <style>
        body { margin:0; background:#000; color:#00ffa3; font-family:monospace; overflow:hidden; }
        #ui { position:fixed; top:20px; left:20px; z-index:100; background:rgba(0,0,0,0.85); padding:15px; border-left:4px solid #00ffa3; border-radius:0 10px 10px 0; }
        video { width:100vw; height:100vh; object-fit:cover; background:#050505; }
        .btn { background:#111; color:#00ffa3; border:1px solid #00ffa3; padding:10px; cursor:pointer; margin-top:10px; width:100%; font-weight:bold; }
        .btn-danger { color:#ff4444; border-color:#ff4444; }
        .status-val { color:#fff; }
    </style>
</head>
<body>
    <div id="ui">
        <strong style="font-size:1.2em; letter-spacing:2px;">DANASIRI ENGINE</strong><br>
        <small>STATUS: <span id="status" class="status-val">WAITING...</span></small>
        
        <div id="push-ui" style="display:none;">
            <hr style="border:0; border-top:1px solid #333; margin:10px 0;">
            <label style="font-size:10px;">BITRATE CAP:</label>
            <select id="bitrate" class="btn">
                <option value="6000">1080p | 6 Mbps</option>
                <option value="12000">1080p | 12 Mbps</option>
            </select>
            <button id="disconnectBtn" class="btn btn-danger">DISCONNECT</button>
        </div>
    </div>

    <video id="v" autoplay playsinline muted></video>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io({ transports: ['websocket'] });
        const params = new URLSearchParams(window.location.search);
        const role = params.get('role');
        const roomId = window.location.pathname.split('/')[1] || 'lobby';
        
        const status = document.getElementById('status');
        const videoEl = document.getElementById('v');
        
        let pc;
        let localStream;

        const config = {
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }],
            iceCandidatePoolSize: 10
        };

        async function init() {
            pc = new RTCPeerConnection(config);

            // 1. ICE Candidate Relay
            pc.onicecandidate = (e) => {
                if (e.candidate) socket.emit('signal', { roomId, content: { candidate: e.candidate } });
            };

            // 2. Connection State Monitor
            pc.onconnectionstatechange = () => {
                status.innerText = pc.connectionState.toUpperCase();
                if(pc.connectionState === 'connected' && role === 'push') applyBitrate();
            };

            if (role === 'push') {
                document.getElementById('push-ui').style.display = 'block';
                // BACK CAMERA + 16:9 OBS RESOLUTION
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({
                        video: { 
                            width: { ideal: 1920 }, 
                            height: { ideal: 1080 }, 
                            aspectRatio: 1.777777778,
                            facingMode: { ideal: "environment" } 
                        },
                        audio: true
                    });
                    videoEl.srcObject = localStream;
                    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
                } catch (err) {
                    status.innerText = "CAMERA ERROR";
                    console.error(err);
                }
            } else {
                // VIEWER MODE
                videoEl.muted = false; // Allow audio for OBS
                pc.ontrack = (e) => { videoEl.srcObject = e.streams[0]; };
            }

            socket.emit('join-room', roomId);
        }

        // --- NEGOTIATION HANDSHAKE ---

        socket.on('peer-ready', () => {
            status.innerText = "PEER JOINED";
            // The Viewer triggers the process to ensure the Pusher is already active
            if (role === 'view') {
                socket.emit('signal', { roomId, content: { type: 'RESTART_NEGOTIATION' } });
            }
        });

        socket.on('signal', async (data) => {
            if (data.type === 'RESTART_NEGOTIATION' && role === 'push') {
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                socket.emit('signal', { roomId, content: { sdp: offer } });
            } 
            else if (data.sdp) {
                await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
                if (data.sdp.type === 'offer') {
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    socket.emit('signal', { roomId, content: { sdp: answer } });
                }
            } 
            else if (data.candidate) {
                pc.addIceCandidate(new RTCIceCandidate(data.candidate)).catch(() => {});
            }
        });

        // --- CONTROLS ---

       async function applyBitrate() {
    const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
    if (sender) {
        const p = sender.getParameters();
        if (!p.encodings) p.encodings = [{}];

        // 1. Force the high bitrate
        p.encodings[0].maxBitrate = document.getElementById('bitrate').value * 1000;
        
        // 2. Disable resolution scaling (Stops the "blurriness")
        // This forces the browser to stay at 1080p even if the signal drops slightly
        p.encodings[0].scaleResolutionDownBy = 1.0; 
        
        // 3. Set priority to high
        p.encodings[0].priority = "high";

        await sender.setParameters(p);
        console.log("HD Quality Locked");
    }
}

        function disconnect() {
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            if (pc) pc.close();
            socket.disconnect();
            status.innerText = "DISCONNECTED";
            videoEl.srcObject = null;
            setTimeout(() => location.reload(), 1500);
        }

        document.getElementById('bitrate').onchange = applyBitrate;
        document.getElementById('disconnectBtn').onclick = disconnect;

        init();
    </script>
</body>
</html>
