<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DANASIRI | PRO LIVE</title>
    <style>
        body { margin:0; background:#050505; color:#00ffa3; font-family:monospace; overflow:hidden; }
        #ui { position:fixed; top:10px; left:10px; z-index:100; background:rgba(0,0,0,0.9); padding:15px; border-radius:8px; border: 1px solid #333; width: 260px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        video { width:100vw; height:100vh; object-fit:cover; background:#000; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 15px; }
        .btn { background:#1a1a1a; color:#fff; border:1px solid #444; padding:10px 5px; cursor:pointer; font-size:11px; border-radius:4px; font-weight:bold; text-transform: uppercase; }
        .btn.active { background: #00ffa3; color: #000; border-color: #00ffa3; }
        .btn-danger { color:#ff4444; border-color:#ff4444; }
        .slider-container { margin-top: 10px; font-size: 11px; color: #ccc; }
        input[type=range] { width: 100%; margin-top: 8px; accent-color: #00ffa3; cursor: pointer; }
        hr { border:0; border-top:1px solid #333; margin:15px 0; }
        .stat-label { color: #888; font-size: 10px; }
    </style>
</head>
<body>
    <div id="ui">
        <strong style="font-size:1.2em; color:#fff; letter-spacing:1px;">DANASIRI ENGINE</strong><br>
        <span class="stat-label">NETWORK:</span> <span id="status">INITIALIZING...</span>
        
        <div id="push-ui" style="display:none;">
            <hr>
            <div class="slider-container">
                BITRATE: <span id="bitrate-val" style="color:#fff; font-weight:bold;">8000</span> kbps
                <input type="range" id="bitrate" min="2000" max="15000" step="500" value="8000">
            </div>

            <div class="grid-2">
                <button id="toggleMic" class="btn active">🎤 MIC ON</button>
                <button id="toggleCam" class="btn active">📷 CAM ON</button>
                <button id="switchCam" class="btn">🔄 FLIP CAM</button>
                <button id="disconnectBtn" class="btn btn-danger">⏹ END LIVE</button>
            </div>
        </div>
    </div>

    <video id="v" autoplay playsinline muted></video>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io({ transports: ['websocket'] });
        const role = new URLSearchParams(window.location.search).get('role');
        const roomId = window.location.pathname.split('/')[1] || 'lobby';
        
        const videoEl = document.getElementById('v');
        const statusEl = document.getElementById('status');
        
        let pc;
        let localStream;
        let currentFacingMode = "environment";

        // ==========================================
        // ✅ VERIFIED TURN CONFIGURATION
        // ==========================================
        const config = {
            iceServers: [
                { urls: "stun:stun.relay.metered.ca:80" },
                {
                    urls: "turn:global.relay.metered.ca:80",
                    username: "101d4507c88455da847c6923",
                    credential: "mCRxx8b40O+Flt6A",
                },
                {
                    urls: "turn:global.relay.metered.ca:80?transport=tcp",
                    username: "101d4507c88455da847c6923",
                    credential: "mCRxx8b40O+Flt6A",
                },
                {
                    urls: "turn:global.relay.metered.ca:443",
                    username: "101d4507c88455da847c6923",
                    credential: "mCRxx8b40O+Flt6A",
                },
                {
                    urls: "turns:global.relay.metered.ca:443?transport=tcp",
                    username: "101d4507c88455da847c6923",
                    credential: "mCRxx8b40O+Flt6A",
                }
            ],
            iceTransportPolicy: 'all',
            iceCandidatePoolSize: 10
        };

        async function init() {
            pc = new RTCPeerConnection(config);

            pc.onicecandidate = (e) => {
                if (e.candidate) socket.emit('signal', { roomId, content: { candidate: e.candidate } });
            };

            pc.onconnectionstatechange = () => {
                statusEl.innerText = pc.connectionState.toUpperCase();
                if(pc.connectionState === 'connected') statusEl.style.color = "#00ffa3";
                if(pc.connectionState === 'connected' && role === 'push') updateVideoQuality();
            };

            if (role === 'push') {
                document.getElementById('push-ui').style.display = 'block';
                await startCamera();
            } else {
                videoEl.muted = false; 
                pc.ontrack = (e) => { videoEl.srcObject = e.streams[0]; };
            }

            socket.emit('join-room', roomId);
        }

        async function startCamera() {
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 30 }, facingMode: { ideal: currentFacingMode } },
                    audio: { echoCancellation: false, noiseSuppression: false } 
                });
                videoEl.srcObject = localStream;
                if (pc.getSenders().length > 0) {
                    const videoTrack = localStream.getVideoTracks()[0];
                    const sender = pc.getSenders().find(s => s.track.kind === 'video');
                    if (sender) sender.replaceTrack(videoTrack);
                } else {
                    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
                }
            } catch (err) {
                statusEl.innerText = "CAMERA ERROR";
                statusEl.style.color = "#ff4444";
            }
        }

        socket.on('peer-ready', () => {
            if (role === 'view') socket.emit('signal', { roomId, content: { type: 'RESTART' } });
        });

        socket.on('signal', async (data) => {
            if (data.type === 'RESTART' && role === 'push') {
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                socket.emit('signal', { roomId, content: { sdp: offer } });
            } 
            else if (data.sdp) {
                await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
                if (data.sdp.type === 'offer') {
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    socket.emit('signal', { roomId, content: { sdp: answer } });
                }
            } 
            else if (data.candidate) {
                pc.addIceCandidate(new RTCIceCandidate(data.candidate)).catch(() => {});
            }
        });

        async function updateVideoQuality() {
            const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
            if (sender) {
                const p = sender.getParameters();
                if (!p.encodings) p.encodings = [{}];
                const bitrate = document.getElementById('bitrate').value;
                document.getElementById('bitrate-val').innerText = bitrate;
                p.encodings[0].maxBitrate = bitrate * 1000;
                p.encodings[0].scaleResolutionDownBy = 1.0; 
                p.encodings[0].priority = "high"; 
                await sender.setParameters(p);
            }
        }

        document.getElementById('bitrate').oninput = updateVideoQuality;

        document.getElementById('toggleMic').onclick = (e) => {
            const track = localStream.getAudioTracks()[0];
            if (track) {
                track.enabled = !track.enabled;
                e.target.innerText = track.enabled ? "🎤 MIC ON" : "🔇 MIC MUTED";
                e.target.className = track.enabled ? "btn active" : "btn btn-danger";
            }
        };

        document.getElementById('toggleCam').onclick = (e) => {
            const track = localStream.getVideoTracks()[0];
            if (track) {
                track.enabled = !track.enabled;
                e.target.innerText = track.enabled ? "📷 CAM ON" : "🚫 CAM OFF";
                e.target.className = track.enabled ? "btn active" : "btn btn-danger";
            }
        };

        document.getElementById('switchCam').onclick = async () => {
            currentFacingMode = currentFacingMode === "environment" ? "user" : "environment";
            await startCamera();
        };

        document.getElementById('disconnectBtn').onclick = () => {
            if(localStream) localStream.getTracks().forEach(t => t.stop());
            if(pc) pc.close();
            socket.disconnect();
            location.reload();
        };

        if(role) init();
    </script>
</body>
</html>
