<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DANASIRI | PRO STUDIO</title>
    <style>
        :root { --accent: #00ffa3; --bg: #0a0a0a; }
        body { margin:0; background: var(--bg); color: #eee; font-family: sans-serif; overflow:hidden; }
        #v { width:100vw; height:100vh; object-fit:cover; position:fixed; top:0; left:0; z-index:1; }
        #push-ui { 
            position:fixed; top:20px; left:20px; z-index:100; 
            background: rgba(15,15,15,0.9); padding:15px; border-radius:12px; 
            border: 1px solid #333; width: 260px;
        }
        .label { font-size: 10px; color: #888; text-transform: uppercase; margin-bottom: 5px; display:block; }
        select, button { width: 100%; background: #222; color: #fff; border: 1px solid #444; padding: 10px; border-radius: 6px; margin-bottom: 10px; cursor: pointer; }
        .btn-apply { border-color: var(--accent); color: var(--accent); font-weight: bold; }
        input[type=range] { width: 100%; accent-color: var(--accent); }
    </style>
</head>
<body>
    <video id="v" autoplay playsinline muted></video>

    <div id="push-ui">
        <div style="color:var(--accent); font-weight:bold; margin-bottom:15px;">DANASIRI PRO v2</div>
        <span class="label">Hardware Lens</span>
        <select id="cameraSelect"></select>
        <span class="label">Aspect Ratio</span>
        <select id="aspectSelect">
            <option value="1.7777777778">16:9 Widescreen</option>
            <option value="0.5625">9:16 Vertical</option>
            <option value="1.3333333333">4:3 Standard</option>
        </select>
        <span class="label">Zoom Control</span>
        <input type="range" id="zoom" min="1" max="10" step="0.1" value="1">
        <button id="refreshBtn" class="btn-apply">APPLY SETTINGS</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io({ transports: ['websocket'] });
        const roomId = window.location.pathname.split('/')[1] || 'lobby';
        const role = new URLSearchParams(window.location.search).get('role') || 'push';
        let pc, localStream, videoTrack;

        const rtcConfig = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

        async function init() {
            pc = new RTCPeerConnection(rtcConfig);
            
            // Send ICE candidates to the other peer
            pc.onicecandidate = (e) => e.candidate && socket.emit('signal', { roomId, content: { candidate: e.candidate } });
            
            // For the viewer: catch the incoming stream
            pc.ontrack = (e) => {
                if (role === 'view') document.getElementById('v').srcObject = e.streams[0];
            };

            if (role === 'push') {
                await setupCamera();
            } else {
                // Viewer mode: hide UI and unmute audio
                document.getElementById('push-ui').style.display = 'none';
                document.getElementById('v').muted = false;
            }

            socket.emit('join-room', roomId);
        }

        async function setupCamera() {
            const devices = await navigator.mediaDevices.enumerateDevices();
            const vids = devices.filter(d => d.kind === 'videoinput');
            const sel = document.getElementById('cameraSelect');
            sel.innerHTML = vids.map((d, i) => `<option value="${d.deviceId}">${d.label || 'Lens ' + i}</option>`).join('');
            await startCam();
        }

        async function startCam() {
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            const constraints = {
                video: {
                    deviceId: { exact: document.getElementById('cameraSelect').value },
                    aspectRatio: { ideal: parseFloat(document.getElementById('aspectSelect').value) }
                },
                audio: true
            };
            localStream = await navigator.mediaDevices.getUserMedia(constraints);
            document.getElementById('v').srcObject = localStream;
            videoTrack = localStream.getVideoTracks()[0];
            
            // Add tracks to the peer connection
            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
        }

        // --- Signaling Logic ---
        socket.on('peer-ready', async () => {
            if (role === 'push') {
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                socket.emit('signal', { roomId, content: { sdp: offer } });
            }
        });

        socket.on('signal', async (data) => {
            if (data.sdp) {
                await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
                if (data.sdp.type === 'offer') {
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    socket.emit('signal', { roomId, content: { sdp: answer } });
                }
            } else if (data.candidate) {
                await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
            }
        });

        document.getElementById('refreshBtn').onclick = startCam;
        init();
    </script>
</body>
</html>
